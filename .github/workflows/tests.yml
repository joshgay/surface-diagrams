name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  editor-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check src/surface_diagrams/editor_assets/editor.js
      - run: node --test tests/editor_state.test.cjs
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python examples/make_images.py
      - run: python examples/make_latex.py
      - name: Regenerate checked genus and tutorial figures
        if: matrix.python-version == '3.12'
        run: |
          python examples/make_genus_cuts.py
          python examples/tutorial.py
      - run: git diff --exit-code -- examples/output
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python examples/make_latex.py
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-pictures
      - run: pdflatex -interaction=nonstopmode -halt-on-error latex-gallery.tex
        working-directory: examples/output
      - run: python examples/tutorial.py
      - run: pdflatex -interaction=nonstopmode -halt-on-error tutorial-gallery.tex
        working-directory: examples/output/tutorial
