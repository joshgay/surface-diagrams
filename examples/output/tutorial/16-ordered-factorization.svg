<text x="208" y="545" fill="#000000" font-size="10" font-family="serif" text-anchor="middle">1. [a]</text>
<text x="208" y="560" fill="#000000" font-size="10" font-family="serif" text-anchor="middle">Half twist on c1</text>
<text x="208" y="333.5" fill="#000000" font-size="10" font-family="serif" text-anchor="middle">2. [b]^-1</text>
<text x="208" y="348.5" fill="#000000" font-size="10" font-family="serif" text-anchor="middle">Inverse half twist on c2</text>
<text x="208" y="122" fill="#000000" font-size="10" font-family="serif" text-anchor="middle">3. [a-again]</text>
<text x="208" y="137" fill="#000000" font-size="10" font-family="serif" text-anchor="middle">Same support c1; distinct factor ID</text>
<text x="371" y="722.5" fill="#d73027" font-size="9" font-family="serif" text-anchor="middle">1</text>
