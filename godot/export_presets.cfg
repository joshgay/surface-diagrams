[preset.0]
name="Web proof of concept"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="fixtures/*.json,fixtures/workspaces/*.json,fixtures/surfaces/*.json,fixtures/walkthroughs/*.json"
exclude_filter="tests/*,bridge/*,web/*,demo/*,benchmark/*,visual_review/*"
export_path="builds/web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/shell.html"
html/head_include="<script src=\"browser_files.js\"></script><script src=\"viewport.js\"></script><script src=\"wasm_loader.js\"></script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]
name="Linux portable pack"
platform="Linux"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="fixtures/*.json,fixtures/workspaces/*.json,fixtures/surfaces/*.json,fixtures/walkthroughs/*.json"
exclude_filter="tests/*,bridge/*,web/*,demo/*,benchmark/*,visual_review/*,builds/*"
export_path="builds/linux/surface-diagrams-studio.pck"
script_export_mode=2

[preset.1.options]
custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"
binary_format/embed_pck=false
