[preset.0]
name="Web proof of concept"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="fixtures/*.json,fixtures/workspaces/*.json,fixtures/surfaces/*.json,fixtures/walkthroughs/*.json"
exclude_filter="tests/*,bridge/*,web/*,demo/*"
export_path="builds/web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/shell.html"
html/head_include="<script src=\"browser_files.js\"></script><script src=\"wasm_loader.js\"></script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
