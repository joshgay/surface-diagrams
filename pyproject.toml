[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "surface-diagrams"
version = "0.1.0a1"
description = "Dependency-free surface diagrams, planar arcs and loops in SVG"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Richard Buckman"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
