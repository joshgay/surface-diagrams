[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "surface-diagrams"
version = "0.1.0a3"
description = "Dependency-free surface diagrams, planar arcs and loops in SVG and TikZ"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Richard Buckman"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
surface-diagrams = "surface_diagrams.__main__:main"
surface-diagrams-editor = "surface_diagrams.editor:main"

[tool.setuptools.package-data]
surface_diagrams = ["editor_assets/*.html", "editor_assets/*.css", "editor_assets/*.js"]

[tool.setuptools.data-files]
"share/surface-diagrams/latex" = ["latex/surface-diagrams.sty", "latex/README.md"]
